<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025/2026 Fixtures | Supreme League</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
    }

    header {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                  url("Images/background.jpg");
      background-size: cover;
      background-position: center;
      padding: 40px 20px;
      text-align: center;
    }

    nav a {
      color: #f5c542;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    section {
      padding: 40px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .fixtures-title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 30px;
      color: #f5c542;
      font-weight: bold;
    }

    /* GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .gallery-item {
  border-radius: 12px;
  overflow: hidden;
  background: #111;
}
    
    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    /* HOVER FADE */
    .gallery-item:hover img {
      transform: scale(1.08);
      opacity: 0.75;
    }

    /* TEAM NAME — own space */
.team-name {
  padding: 10px;
  background: #111;
  color: #f5c542;
  font-weight: bold;
  text-align: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      flex-direction: column;
      text-align: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .lightbox-team {
      font-size: 20px;
      color: #f5c542;
      font-weight: bold;
    }

    .lightbox span {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 35px;
      color: white;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      font-size: 14px;
      opacity: 0.8;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Supreme League Fixtures</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="home.html">History</a>
    </nav>
  </header>

  <section>
    <div class="fixtures-title">2025/2026 Season Fixtures</div>

    <div class="gallery">

      <div class="gallery-item">
        <div class="team-name">Divinity FC (OTC)</div>
        <img src="Images/D1.jpg" onclick="openLightbox(this.src, 'Divinity FC')">
      </div>

      <div class="gallery-item">
        <div class="team-name">Humbled FC</div>
        <img src="Images/D2.jpg" onclick="openLightbox(this.src, 'Humbled FC')">
      </div>

      <div class="gallery-item">
        <div class="team-name">Hik FC</div>
        <img src="Images/D3.jpg" onclick="openLightbox(this.src, 'Hik FC')">
      </div>

      <div class="gallery-item">
        <div class="team-name">Storm Chaser</div>
        <img src="Images/D4.jpg" onclick="openLightbox(this.src, 'Storm Chaser')">
      </div>

      <div class="gallery-item">
        <div class="team-name">Ayoola Becoming Champ</div>
        <img src="Images/D5.jpg" onclick="openLightbox(this.src, 'Ayoola Becoming Champ')">
      </div>

      <div class="gallery-item">
        <div class="team-name">Ruthless FC</div>
        <img src="Images/D6.jpg" onclick="openLightbox(this.src, 'Ruthless FC')">
      </div>

      <div class="gallery-item">
        <div class="team-name">Fallen Angel</div>
        <img src="Images/D7.jpg" onclick="openLightbox(this.src, 'Fallen Angel')">
      </div>

    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span>&times;</span>
    <img id="lightbox-img">
    <div class="lightbox-team" id="lightbox-team"></div>
  </div>

  <footer>
    © 2026 Supreme League. All rights reserved.
  </footer>

  <script>
    function openLightbox(src, team) {
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox-team").textContent = team;
      document.getElementById("lightbox").style.display = "flex";
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }
  </script>

</body>
</html>
